    <text x="54" y="547" class="label">5</text><rect x="84" y="532" width="1" height="18" fill="#6ee7b7"/><rect x="85" y="532" width="1" height="18" fill="#60a5fa"/><rect x="86" y="532" width="44" height="18" fill="#c084fc"/><text x="505" y="547" class="value">45.05</text>
    <text x="54" y="578" class="label">6</text><rect x="84" y="563" width="1" height="18" fill="#6ee7b7"/><rect x="85" y="563" width="16" height="18" fill="#60a5fa"/><rect x="101" y="563" width="32" height="18" fill="#c084fc"/><text x="505" y="578" class="value">48.11</text>
    <text x="54" y="609" class="label">7</text><rect x="84" y="594" width="1" height="18" fill="#6ee7b7"/><rect x="85" y="594" width="206" height="18" fill="#60a5fa"/><rect x="291" y="594" width="20" height="18" fill="#c084fc"/><text x="505" y="609" class="value">227.22</text>
