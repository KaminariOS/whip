    <text x="54" y="671" class="label">9</text><rect x="84" y="656" width="1" height="18" fill="#6ee7b7"/><rect x="85" y="656" width="50" height="18" fill="#60a5fa"/><rect x="135" y="656" width="34" height="18" fill="#c084fc"/><text x="505" y="671" class="value">84.99</text>
    <text x="47" y="702" class="label">10</text><rect x="84" y="687" width="1" height="18" fill="#6ee7b7"/><rect x="85" y="687" width="38" height="18" fill="#60a5fa"/><rect x="123" y="687" width="32" height="18" fill="#c084fc"/><text x="505" y="702" class="value">70.34</text>

