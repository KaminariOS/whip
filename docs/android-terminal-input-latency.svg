    <text x="630" y="547" class="label">15</text><rect x="666" y="532" width="1" height="18" fill="#6ee7b7"/><rect x="667" y="532" width="15" height="18" fill="#60a5fa"/><rect x="682" y="532" width="25" height="18" fill="#c084fc"/><text x="1080" y="547" class="value">39.60</text>
    <text x="630" y="578" class="label">16</text><rect x="666" y="563" width="1" height="18" fill="#6ee7b7"/><rect x="667" y="563" width="73" height="18" fill="#60a5fa"/><rect x="740" y="563" width="29" height="18" fill="#c084fc"/><text x="1080" y="578" class="value">101.83</text>
    <text x="630" y="609" class="label">17</text><rect x="666" y="594" width="1" height="18" fill="#6ee7b7"/><rect x="667" y="594" width="36" height="18" fill="#60a5fa"/><rect x="703" y="594" width="32" height="18" fill="#c084fc"/><text x="1080" y="609" class="value">68.01</text>
    <text x="630" y="640" class="label">18</text><rect x="666" y="625" width="1" height="18" fill="#6ee7b7"/><rect x="667" y="625" width="69" height="18" fill="#60a5fa"/><rect x="736" y="625" width="30" height="18" fill="#c084fc"/><text x="1080" y="640" class="value">98.62</text>
    <text x="630" y="671" class="label">19</text><rect x="666" y="656" width="1" height="18" fill="#6ee7b7"/><rect x="667" y="656" width="83" height="18" fill="#60a5fa"/><rect x="750" y="656" width="26" height="18" fill="#c084fc"/><text x="1080" y="671" class="value">109.30</text>
    <text x="630" y="702" class="label">20</text><rect x="666" y="687" width="1" height="18" fill="#6ee7b7"/><rect x="667" y="687" width="89" height="18" fill="#60a5fa"/><rect x="756" y="687" width="26" height="18" fill="#c084fc"/><text x="1080" y="702" class="value">114.92</text>
  </g>

  <text x="54" y="758" class="heading">Newest post-change passive inbound capture</text>
  <text x="54" y="782" class="small">277 complete frames after Rust-side terminal encoding: average 39.29 ms · p50 38.95 ms · p95 55.43 ms · range 19.09–73.58 ms.</text>
  <line x1="230" y1="824" x2="710" y2="824" class="axis"/>
  <rect x="345" y="810" width="326" height="28" rx="3" fill="#c084fc"/>
  <line x1="464" y1="801" x2="464" y2="847" stroke="#6ee7b7" stroke-width="3"/>
  <line x1="563" y1="801" x2="563" y2="847" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="466" cy="824" r="5" fill="#ffffff"/>
  <text x="430" y="798" class="value">average 39.29</text>
  <text x="438" y="866" class="small">p50 38.95</text>
  <text x="540" y="866" class="small">p95 55.43</text>
