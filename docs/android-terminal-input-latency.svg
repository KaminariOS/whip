    <text x="630" y="454" class="label">12</text><rect x="666" y="439" width="1" height="18" fill="#6ee7b7"/><rect x="667" y="439" width="344" height="18" fill="#60a5fa"/><rect x="1011" y="439" width="31" height="18" fill="#c084fc"/><text x="1080" y="454" class="value">375.17</text>
