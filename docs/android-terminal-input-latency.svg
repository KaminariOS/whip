<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Whip Android terminal input latency</title>
  <desc id="description">Perfetto measurements from August 27, 2026. Twenty correlated keystrokes averaged 120.60 milliseconds from input to the conservative visibility marker.</desc>
  <rect width="1200" height="900" fill="#0b1020"/>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #e8edf7; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #9fb0ca; }
    .heading { font-size: 19px; font-weight: 650; }
    .label { font-size: 14px; }
    .small { font-size: 13px; fill: #aab8ce; }
    .value { font-size: 14px; font-weight: 650; }
    .axis { stroke: #41506b; stroke-width: 1; }
    .grid { stroke: #263149; stroke-width: 1; }
  </style>

  <text x="54" y="54" class="title">Whip terminal input latency</text>
  <text x="54" y="83" class="subtitle">Perfetto · Pixel 9 Pro → thinker · August 27, 2026 · 20 correlated keystrokes</text>

  <text x="54" y="132" class="heading">Average input → confirmed visible: 120.60 ms</text>
  <text x="54" y="158" class="small">Additive critical path; the first returned terminal frame is a correlation proxy, not a protocol acknowledgement.</text>

  <line x1="230" y1="188" x2="1010" y2="188" class="axis"/>
  <g class="small">
    <text x="226" y="179">0</text>
    <text x="399" y="179">30</text>
    <text x="579" y="179">60</text>
    <text x="759" y="179">90</text>
    <text x="932" y="179">120</text>
    <text x="992" y="179">130 ms</text>
  </g>
  <g class="grid">
    <line x1="230" y1="188" x2="230" y2="266"/>
    <line x1="410" y1="188" x2="410" y2="266"/>
    <line x1="590" y1="188" x2="590" y2="266"/>
    <line x1="770" y1="188" x2="770" y2="266"/>
    <line x1="950" y1="188" x2="950" y2="266"/>
    <line x1="1010" y1="188" x2="1010" y2="266"/>
  </g>
  <rect x="230" y="207" width="3" height="46" rx="2" fill="#6ee7b7"/>
  <rect x="233" y="207" width="509" height="46" rx="3" fill="#60a5fa"/>
  <rect x="742" y="207" width="213" height="46" rx="3" fill="#c084fc"/>
  <text x="230" y="200" class="value">local 0.39 ms</text>
  <text x="410" y="236" class="value">queue accepted → returned frame 84.76 ms</text>
  <text x="760" y="236" class="value">frame → visible 35.45 ms</text>

  <g transform="translate(54 292)">
    <rect x="0" y="0" width="15" height="15" rx="3" fill="#6ee7b7"/>
    <text x="24" y="13" class="small">React Native input → native dispatch</text>
    <rect x="306" y="0" width="15" height="15" rx="3" fill="#60a5fa"/>
    <text x="330" y="13" class="small">native queue → first returned frame</text>
    <rect x="650" y="0" width="15" height="15" rx="3" fill="#c084fc"/>
    <text x="674" y="13" class="small">renderer frame → two-RAF visibility marker</text>
  </g>

  <text x="54" y="354" class="heading">Individual correlated samples</text>
  <text x="54" y="378" class="small">Scale: 1 px = 1 ms. Total p50 92.66 ms · p95 243.26 ms · observed range 39.60–375.17 ms.</text>

