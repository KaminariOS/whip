    <text x="54" y="454" class="label">2</text><rect x="84" y="439" width="1" height="18" fill="#6ee7b7"/><rect x="85" y="439" width="143" height="18" fill="#60a5fa"/><rect x="228" y="439" width="32" height="18" fill="#c084fc"/><text x="505" y="454" class="value">175.56</text>
