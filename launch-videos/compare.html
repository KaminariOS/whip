<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whip · HyperFrames production master</title>
    <style>
      :root { color-scheme: dark; font-family: Inter,system-ui,sans-serif; background:#06070b; color:#f7f5f2; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; padding:30px; background:radial-gradient(circle at 20% -10%,#4a160f,#06070b 42%); }
      main { max-width:1440px; margin:auto; }
      header { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:22px; }
      .eyebrow { color:#ff5b42; font-size:12px; font-weight:800; letter-spacing:.23em; }
      h1 { margin:8px 0 0; font-size:clamp(32px,5vw,68px); line-height:.94; letter-spacing:-.055em; }
      p { max-width:680px; margin:10px 0 0; color:#a7aab7; }
      button { border:1px solid #4a4e5b; border-radius:999px; padding:12px 19px; background:#12141b; color:#f7f5f2; font:700 14px inherit; cursor:pointer; }
      button:hover { border-color:#ff5b42; }
      .player { overflow:hidden; border:1px solid #292d38; border-radius:20px; background:#080a0f; box-shadow:0 38px 120px rgba(0,0,0,.55); }
      video { display:block; width:100%; aspect-ratio:16/9; background:#000; }
      .meta { display:flex; justify-content:space-between; gap:20px; padding:16px 19px; color:#8e93a3; font-size:11px; font-weight:800; letter-spacing:.16em; }
      .meta b { color:#ff654d; }
      @media (max-width:760px) { body{padding:18px} header{align-items:start;flex-direction:column}.meta{flex-direction:column} }
    </style>
  </head>
  <body>
    <main>
      <header><div><div class="eyebrow">PRODUCTION MASTER · HYPERFRAMES</div><h1>Whip launch film</h1><p>Herdr desktop to Android: live sync, status alerts, seamless focus handoff, and native intervention.</p></div><button id="restart">Restart</button></header>
      <section class="player"><video controls autoplay preload="metadata" src="output/whip-launch-hyperframes.mp4"></video><div class="meta"><span><b>24 SEC</b> · 1920×1080 · 30 FPS</span><span>“TECHNO FIGHTS” · MIXKIT FREE MUSIC LICENSE</span></div></section>
    </main>
    <script>const video=document.querySelector('video');document.querySelector('#restart').addEventListener('click',()=>{video.currentTime=0;video.play();});</script>
  </body>
</html>
