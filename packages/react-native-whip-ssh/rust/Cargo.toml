[package]
name = "whip-ssh"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Private WP4 pairing transport for Whip"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.22"
russh = { version = "0.62", default-features = false, features = ["flate2", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519", "getrandom"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uniffi = "=0.31"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
