[package]
name = "whip-ssh"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Rust SSH transport used by Whip on iOS"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.22"
futures = "0.3"
hmac = "0.12"
parking_lot = "0.12"
russh = { version = "0.62", default-features = false, features = ["flate2", "ring"] }
russh-sftp = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519", "getrandom"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time"] }
uniffi = "=0.31"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
