[package]
name = "whipair"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "Direct, QR-based SSH public-key enrollment prototype for Whip"
repository = "https://github.com/KaminariOS/whip"
readme = "README.md"
keywords = ["ssh", "qr-code", "authorized-keys", "pairing", "cli"]
categories = ["authentication", "command-line-utilities"]
publish = ["crates-io"]
exclude = ["/npm", "/pyproject.toml"]

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
if-addrs = "0.13"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
russh = { version = "=0.62.6", default-features = false, features = ["flate2", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["ecdsa", "ed25519", "std"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
