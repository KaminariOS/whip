name: Publish react-native-russh to npm

on:
  push:
    tags:
      - 'react-native-russh-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version from packages/react-native-russh/package.json
        required: true
        default: 0.1.0
        type: string
      bootstrap_with_token:
        description: Bootstrap the first npm release with NPM_TOKEN
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-react-native-russh
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source and public API
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt

      - name: Verify release versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm_version="$(node -p "require('./packages/react-native-russh/package.json').version")"
          cargo_version="$(cargo metadata --locked --format-version 1 --no-deps \
            --manifest-path packages/react-native-russh/rust/Cargo.toml \
            | jq -r '.packages[0].version')"
          if [[ "$EVENT_NAME" == "push" ]]; then
            expected_version="${RELEASE_TAG#react-native-russh-v}"
          else
            expected_version="$MANUAL_VERSION"
          fi
          test "$npm_version" = "$expected_version"
          test "$cargo_version" = "$expected_version"

      - name: Check public API boundary
        run: |
          if grep -Eiq 'herdr|pairHost|PairHost' \
            packages/react-native-russh/lib/sshclient.js \
            packages/react-native-russh/lib/sshclient.d.ts; then
            echo "Whip-specific API leaked into react-native-russh" >&2
            exit 1
          fi
          node --check packages/react-native-russh/lib/sshclient.js

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path packages/react-native-russh/rust/Cargo.toml

      - name: Lint Rust transport
        run: >-
          cargo clippy --locked --all-targets
          --manifest-path packages/react-native-russh/rust/Cargo.toml
          -- -D warnings

      - name: Test Rust transport
        run: cargo test --locked --manifest-path packages/react-native-russh/rust/Cargo.toml

  android:
    name: Build Android ARM64 library
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build ARM64 Rust library
        run: nix develop .#default -c bash packages/react-native-russh/rust/build-android.sh

      - name: Archive Android library
        run: |
          test -f packages/react-native-russh/android/src/main/jniLibs/arm64-v8a/libreact_native_russh.a
          tar -czf "$RUNNER_TEMP/react-native-russh-android-arm64.tar.gz" \
            -C packages/react-native-russh/android/src/main/jniLibs arm64-v8a

      - name: Upload Android library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: react-native-russh-android-arm64
          path: ${{ runner.temp }}/react-native-russh-android-arm64.tar.gz
          if-no-files-found: error
          retention-days: 3

  ios:
    name: Build iOS ARM64 XCFramework
    needs: verify
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain and ARM64 targets
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build XCFramework
        run: >-
          bash packages/react-native-russh/rust/build-xcframework.sh
          "$RUNNER_TEMP/ReactNativeRussh.xcframework"

      - name: Archive XCFramework
        run: >-
          tar -czf "$RUNNER_TEMP/react-native-russh-ios-arm64.tar.gz"
          -C "$RUNNER_TEMP" ReactNativeRussh.xcframework

      - name: Upload XCFramework
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: react-native-russh-ios-arm64
          path: ${{ runner.temp }}/react-native-russh-ios-arm64.tar.gz
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish npm package
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: react-native-russh-*-arm64
          path: native-dist
          merge-multiple: true

      - name: Assemble and verify package
        run: |
          mkdir -p packages/react-native-russh/android/src/main/jniLibs
          tar -xzf native-dist/react-native-russh-android-arm64.tar.gz \
            -C packages/react-native-russh/android/src/main/jniLibs
          mkdir -p packages/react-native-russh/build
          tar -xzf native-dist/react-native-russh-ios-arm64.tar.gz \
            -C packages/react-native-russh/build
          cp LICENSE packages/react-native-russh/LICENSE
          test -f packages/react-native-russh/android/src/main/jniLibs/arm64-v8a/libreact_native_russh.a
          test -d packages/react-native-russh/build/ReactNativeRussh.xcframework
          npm pack ./packages/react-native-russh --dry-run

      - name: Publish with npm trusted publishing
        if: github.event_name == 'push' || inputs.bootstrap_with_token == false
        working-directory: packages/react-native-russh
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if npm view "react-native-russh@$package_version" version >/dev/null 2>&1; then
            echo "react-native-russh@$package_version is already published"
          else
            npm publish
          fi

      - name: Bootstrap first release with API token
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_with_token == true
        working-directory: packages/react-native-russh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm publish
