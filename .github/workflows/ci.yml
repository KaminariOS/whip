name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust SSH checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/react-native-ssh-sftp/rust

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/react-native-ssh-sftp/rust

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust SSH transport
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test Rust SSH transport
        run: cargo test --locked

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main
        with:
          token: ${{ github.token }}
          working-directory: packages/react-native-ssh-sftp/rust

      - name: Test against live OpenSSH
        run: bash tests/live-ssh.sh

  javascript:
    name: JavaScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependencies
        run: npx expo-doctor

      - name: Check types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;27.1.12297006"
          "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run Android lint and build
        working-directory: android
        run: >-
          ./gradlew app:lintRelease app:assembleDebug
          -PreactNativeArchitectures=arm64-v8a
          --no-daemon

  ios:
    name: iOS simulator compile
    runs-on: macos-26
    timeout-minutes: 45
    env:
      NODE_ENV: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Report Apple toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Bundle production JavaScript for iOS
        run: npm run bundle:ios

      - name: Set up Ruby and CocoaPods
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install pinned Rust toolchain and iOS targets
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Cache Rust iOS builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/react-native-ssh-sftp/rust

      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install

      - name: Compile unsigned simulator app
        working-directory: ios
        run: |
          set -o pipefail
          device_id="$(xcrun simctl list devices available --json | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            device = devices.find { |candidate| candidate.fetch("name", "").start_with?("iPhone") }
            abort "No available iPhone simulator was found" unless device
            puts device.fetch("udid")
          ')"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild \
            -workspace HerdR.xcworkspace \
            -scheme HerdR \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/WhipDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
          echo "DEVICE_ID=$device_id" >> "$GITHUB_ENV"

      - name: Install and launch simulator app
        run: |
          app_path="$RUNNER_TEMP/WhipDerivedData/Build/Products/Release-iphonesimulator/HerdR.app"
          test -d "$app_path"
          xcrun simctl install "$DEVICE_ID" "$app_path"
          launch_output="$(xcrun simctl launch --terminate-running-process "$DEVICE_ID" io.github.kaminarios.whip)"
          echo "$launch_output"
          app_pid="${launch_output##*: }"
          sleep 10
          if ! kill -0 "$app_pid"; then
            echo 'Whip was not running after launch' >&2
            xcrun simctl spawn "$DEVICE_ID" log show \
              --last 2m \
              --style compact \
              --predicate 'process == "HerdR" OR eventMessage CONTAINS[c] "io.github.kaminarios.whip"'
            exit 1
          fi

      - name: Validate distributable Rust XCFramework
        run: >-
          bash packages/react-native-ssh-sftp/rust/build-xcframework.sh
          "$RUNNER_TEMP/WhipSSH.xcframework"
