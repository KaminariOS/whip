name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to create or update (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: google-play
    env:
      NODE_ENV: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;27.1.12297006"
          "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Install JavaScript dependencies
        run: npm ci --include=dev

      - name: Prepare release signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          required=(
            ANDROID_UPLOAD_KEYSTORE_BASE64
            ANDROID_UPLOAD_KEYSTORE_PASSWORD
            ANDROID_UPLOAD_KEY_ALIAS
            ANDROID_UPLOAD_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

          mkdir -p .eas-secrets
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" \
            | base64 --decode > .eas-secrets/upload-keystore.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$GITHUB_WORKSPACE/.eas-secrets/upload-keystore.jks" \
            "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" \
            "$ANDROID_UPLOAD_KEY_ALIAS" \
            "$ANDROID_UPLOAD_KEY_PASSWORD" \
            > .eas-secrets/upload-keystore.properties
          chmod 600 .eas-secrets/*

      - name: Build signed release APK
        working-directory: android
        env:
          WHIP_UPLOAD_KEYSTORE_PROPERTIES: ${{ github.workspace }}/.eas-secrets/upload-keystore.properties
        run: >-
          ./gradlew app:assembleRelease
          -PreactNativeArchitectures=arm64-v8a
          --no-daemon

      - name: Package APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk whip-arm64.apk
          sha256sum whip-arm64.apk > whip-arm64.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: whip-arm64-apk
          path: |
            whip-arm64.apk
            whip-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_args=(
              "$RELEASE_TAG"
              --target "$GITHUB_SHA"
              --generate-notes
              --latest
              --title "Whip $RELEASE_TAG"
            )
            gh release create "${release_args[@]}"
          else
            gh release edit "$RELEASE_TAG" \
              --prerelease=false \
              --latest \
              --title "Whip $RELEASE_TAG"
          fi

          gh release upload "$RELEASE_TAG" \
            "whip-arm64.apk#Whip APK (arm64-v8a)" \
            "whip-arm64.apk.sha256#SHA-256 checksum" \
            --clobber
