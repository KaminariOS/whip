version: 2

updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 8
    schedule:
      interval: daily
    groups:
      expo-patches:
        applies-to: version-updates
        patterns:
          - expo
          - 'expo-*'
        update-types:
          - patch
      npm-patches:
        applies-to: version-updates
        patterns:
          - '*'
        exclude-patterns:
          - expo
          - 'expo-*'
        update-types:
          - patch
    ignore:
      # React Native 0.86 only accepts ESLint 8 or 9.
      - dependency-name: eslint
        versions:
          - '>= 10.0.0'

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    groups:
      gradle-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
